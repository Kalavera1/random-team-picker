<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Team Picker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="app-header">
    <h1>🎲 Random Team Picker</h1>
  </header>

  <section class="toolbar">
    <div class="toolbar-group">
      <label for="playerNameInput">Spieler hinzufügen</label>
      <div class="input-row">
        <input type="text" id="playerNameInput" placeholder="Name…" maxlength="30" autocomplete="off">
        <button id="addPlayerBtn" class="icon-btn" title="Spieler hinzufügen" type="button">+</button>
      </div>
    </div>

    <div class="toolbar-group">
      <label for="teamSizeInput">Spieler / Team</label>
      <input type="number" id="teamSizeInput" min="1" value="4">
    </div>

    <div class="toolbar-group">
      <label id="distributionLabel">Verteilung</label>
      <div class="segmented" role="radiogroup" aria-labelledby="distributionLabel">
        <button type="button" class="segmented-btn active" data-mode="even" role="radio" aria-checked="true">Gleichverteilt</button>
        <button type="button" class="segmented-btn" data-mode="fill" role="radio" aria-checked="false">Füllen</button>
      </div>
    </div>

    <div class="toolbar-group">
      <label for="seedInput">Seed <span class="hint">(optional)</span></label>
      <input type="text" id="seedInput" placeholder="leer = zufällig" maxlength="40" autocomplete="off">
    </div>

    <div class="toolbar-group team-name-group">
      <label for="teamNameInput">Teamnamen <span class="hint">(optional)</span></label>
      <div class="input-row">
        <input type="text" id="teamNameInput" placeholder="z.B. Team Falken" maxlength="24" autocomplete="off">
        <button id="addTeamNameBtn" class="icon-btn" title="Teamnamen hinzufügen" type="button">+</button>
      </div>
      <div id="teamNameChips" class="chip-row"></div>
      <div class="suggestions-block">
        <div class="suggestions-header">
          <span class="hint">💡 Vorschläge</span>
          <button id="refreshSuggestionsBtn" class="text-btn" type="button" title="Neue Vorschläge">🔄</button>
        </div>
        <div id="teamNameSuggestions" class="chip-row suggestions-row"></div>
      </div>
    </div>

    <button id="drawBtn" class="primary-btn" type="button">🔀 Teams auslosen</button>
  </section>

  <p id="errorMsg" class="error" hidden></p>

  <section class="pool-section">
    <h2>Spieler-Pool <span id="poolCount" class="count-badge">0</span></h2>
    <div id="pool" class="tile-list dropzone" data-team-index="-1"></div>
    <p id="poolEmptyHint" class="empty-hint">Noch keine Spieler – oben Namen hinzufügen.</p>
  </section>

  <section id="teamsSection" class="teams-section" hidden>
    <div id="drawMeta" class="draw-meta" hidden>
      <span id="drawMetaText"></span>
      <button id="downloadCertBtn" class="text-btn" type="button">🖼️ Urkunde herunterladen</button>
    </div>
    <div id="teams" class="teams"></div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
